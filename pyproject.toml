[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "johbloch-oracle-migration"
version = "0.1.0"
description = "Docs-first Oracle migration helper with a Copilot custom agent and a Python CLI."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "JohBloch" }]
keywords = ["oracle", "migration", "postgres", "copilot", "agent", "sql"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://github.com/"

[project.scripts]
oracle-migration = "johbloch_oracle_migration.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
